{% if messages %}
<div class="container position-fixed top-0 start-50 translate-middle-x pt-5 mt-4" style="z-index: 1080; max-width: 600px; width: 90%;">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show shadow-lg border-0 d-flex align-items-center gap-2 mb-2" role="alert">
    {% if message.tags == 'error' %}
      <i class="bi bi-exclamation-octagon-fill fs-5"></i>
    {% elif message.tags == 'success' %}
      <i class="bi bi-check-circle-fill fs-5"></i>
    {% else %}
      <i class="bi bi-info-circle-fill fs-5"></i>
    {% endif %}
    <div class="flex-grow-1">{{ message }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
