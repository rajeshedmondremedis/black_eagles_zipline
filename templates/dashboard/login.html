{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login | Black Eagles Zipline</title>

  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/design-system.css' %}">

  <style>
    body {
      background-color: #0E1613;
      color: #F8F8F4;
      font-family: 'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: 
        radial-gradient(circle at 50% 20%, rgba(18, 59, 42, 0.65) 0%, #0E1613 75%);
      padding: 1.5rem;
    }
    .login-card {
      background: #17211D;
      border: 1px solid rgba(233, 237, 233, 0.12);
      border-radius: 24px;
      padding: clamp(2rem, 5vw, 3.25rem) clamp(1.75rem, 4vw, 2.75rem);
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      position: relative;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #F47B20, transparent);
    }
    .form-control {
      background-color: #0E1613 !important;
      border: 1px solid rgba(233, 237, 233, 0.14) !important;
      color: #FFFFFF !important;
      border-radius: 12px;
      padding: 0.85rem 1rem;
    }
    .form-control:focus {
      border-color: #F47B20 !important;
      box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.28) !important;
    }
    .btn-login {
      background: linear-gradient(135deg, #F47B20 0%, #D86310 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.88rem;
      border-radius: 12px;
      border: none;
      width: 100%;
      transition: all 0.25s ease;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(244, 123, 32, 0.28);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #FF8933 0%, #F47B20 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(244, 123, 32, 0.42);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning bg-opacity-10 text-orange p-3 mb-3 shadow">
        <i class="bi bi-feather fs-1"></i>
      </div>
      <h3 class="fw-bold text-white mb-1" style="font-family: 'Plus Jakarta Sans', sans-serif;">BLACK EAGLES ZIPLINE</h3>
      <span class="text-muted small text-uppercase" style="letter-spacing: 1.5px; font-weight: 600;">Staff & Operations Login</span>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}info{% endif %} py-2 px-3 small border-0 d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <div>{{ message }}</div>
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'dashboard:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-light-grey small fw-bold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-light-grey small fw-bold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Access Operations Console
      </button>

      <div class="text-center">
        <a href="{% url 'website:home' %}" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left"></i> Return to Public Website
        </a>
      </div>
    </form>
  </div>

</body>
</html>
