{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login | Black Eagles Zipline</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #070D0A;
      color: #F8FAFC;
      font-family: 'Outfit', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(15, 42, 29, 0.6) 0%, #070D0A 70%);
      padding: 1.5rem;
    }
    .login-card {
      background: #0F1F17;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .form-control {
      background-color: #070D0A !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #FFFFFF !important;
      border-radius: 10px;
      padding: 0.8rem 1rem;
    }
    .form-control:focus {
      border-color: #F77F00 !important;
      box-shadow: 0 0 0 3px rgba(247, 127, 0, 0.25) !important;
    }
    .btn-login {
      background: linear-gradient(135deg, #F77F00, #E65100);
      color: #FFFFFF;
      font-weight: 700;
      padding: 0.85rem;
      border-radius: 10px;
      border: none;
      width: 100%;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #FF9F1C, #F77F00);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(247, 127, 0, 0.35);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning bg-opacity-10 text-warning p-3 mb-3">
        <i class="bi bi-feather fs-1"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">BLACK EAGLES ZIPLINE</h3>
      <span class="text-muted small text-uppercase" style="letter-spacing: 1.5px;">Staff & Operations Login</span>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}info{% endif %} py-2 px-3 small border-0 d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <div>{{ message }}</div>
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'dashboard:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-light small fw-bold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-light small fw-bold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Access Operations Console
      </button>

      <div class="text-center">
        <a href="{% url 'website:home' %}" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left"></i> Return to Public Website
        </a>
      </div>
    </form>
  </div>

</body>
</html>
