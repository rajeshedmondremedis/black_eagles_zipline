{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login | Black Eagles Zipline</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='85'>🦅</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/design-system.css' %}">

  <style>
    body {
      background-color: var(--c-forest-deep, #0B1712);
      color: var(--c-primary-text, #F5F7F5);
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(24, 166, 106, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(244, 123, 22, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #0B1712 0%, #070E0B 100%);
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: radial-gradient(rgba(48, 68, 58, 0.25) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      opacity: 0.5;
    }

    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--c-emerald-dark, #13251E);
      border: 1px solid var(--c-border, #30443A);
      border-radius: 24px;
      padding: clamp(2rem, 5vw, 3rem) clamp(1.75rem, 4vw, 2.5rem);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--c-burnt-orange, #F47B16), transparent);
    }

    .brand-circle {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(244, 123, 22, 0.12);
      border: 1px solid rgba(244, 123, 22, 0.3);
      color: var(--c-burnt-orange, #F47B16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 24px rgba(244, 123, 22, 0.2);
    }

    .form-group-custom {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .form-group-custom .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--c-muted-text, #82938A);
      font-size: 1.15rem;
      z-index: 3;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-group-custom .form-control {
      background-color: var(--c-card-bg, #1A2D25) !important;
      border: 1px solid var(--c-border, #30443A) !important;
      color: #FFFFFF !important;
      border-radius: 12px !important;
      padding: 0.85rem 1rem 0.85rem 2.85rem !important;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-group-custom .form-control:focus {
      border-color: var(--c-burnt-orange, #F47B16) !important;
      background-color: var(--c-card-secondary, #20352B) !important;
      box-shadow: 0 0 0 3px rgba(244, 123, 22, 0.25) !important;
    }

    .form-group-custom .form-control:focus ~ .input-icon {
      color: var(--c-burnt-orange, #F47B16);
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--c-muted-text, #82938A);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      font-size: 1.1rem;
      z-index: 4;
      transition: color 0.2s ease;
    }

    .password-toggle-btn:hover {
      color: var(--c-white, #FFFFFF);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--c-burnt-orange, #F47B16) 0%, var(--c-orange-hover, #FF922E) 100%);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem;
      border-radius: 12px;
      border: none;
      width: 100%;
      transition: all 0.25s ease;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(244, 123, 22, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, var(--c-orange-hover, #FF922E) 0%, #FFAB5E 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(244, 123, 22, 0.45);
      color: #FFFFFF;
    }

    .login-alert {
      background: var(--c-danger-bg, rgba(224, 82, 82, 0.15));
      border: 1px solid var(--c-danger-border, rgba(224, 82, 82, 0.35));
      color: #FFB3B3;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .back-link {
      color: var(--c-secondary-text, #A6B5AC);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .back-link:hover {
      color: var(--c-burnt-orange, #F47B16);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand-circle">
          <i class="bi bi-feather"></i>
        </div>
        <h3 class="fw-bold text-white mb-1" style="font-family: var(--font-display); letter-spacing: -0.5px;">BLACK EAGLES</h3>
        <div class="text-uppercase small fw-bold" style="letter-spacing: 1.5px; color: var(--c-secondary-text); font-size: 0.75rem;">
          Operations & Control Portal
        </div>
      </div>

      {% if messages %}
        {% for message in messages %}
        <div class="login-alert" role="alert">
          <i class="bi bi-exclamation-triangle-fill fs-5 text-danger flex-shrink-0"></i>
          <div>{{ message }}</div>
        </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'dashboard:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--c-secondary-text);">Username</label>
          <div class="form-group-custom">
            <input type="text" name="username" class="form-control" placeholder="Enter operator username" required autofocus autocomplete="username">
            <i class="bi bi-person input-icon"></i>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--c-secondary-text);">Password</label>
          <div class="form-group-custom">
            <input type="password" id="passwordInput" name="password" class="form-control" placeholder="Enter secure password" required autocomplete="current-password" style="padding-right: 2.75rem !important;">
            <i class="bi bi-shield-lock input-icon"></i>
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login mb-4">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Access Operations Console</span>
        </button>

        <div class="text-center pt-2 border-top" style="border-color: var(--c-border) !important;">
          <a href="{% url 'website:home' %}" class="back-link">
            <i class="bi bi-arrow-left"></i>
            <span>Return to Public Experience</span>
          </a>
        </div>
      </form>
    </div>

    <!-- Security Footnote -->
    <div class="text-center mt-3 text-muted small" style="color: var(--c-muted-text) !important;">
      <i class="bi bi-lock-fill me-1"></i> Authorized Black Eagles Personnel Only
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
      }
    });
  </script>
</body>
</html>
